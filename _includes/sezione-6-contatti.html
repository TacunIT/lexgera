<section id="contatti">
    <div class="corpo">
        <header>
            <h2>Parla con un nostro consulente</h2>

            </p>
        </header>

                    </div>
                    <img src="{{ '/assets/img/contatti-1.png' | relative_url }}" alt="">
                </label>

                <label class="cosa">
                    <input type="radio" name="esigenza" value="Spalla">

                        <h4>Spalla</h4>

                    </div>
                    <img src="{{ '/assets/img/contatti-2.png' | relative_url }}" alt="">
                </label>

                <label class="cosa">
                    <input type="radio" name="esigenza" value="Come stai?">
                    <div>
                        <h4>Come stai?</h4>
                        <p>Voglio capire come sta la mia azienda</p>
                    </div>
                    <img src="{{ '/assets/img/contatti-3.png' | relative_url }}" alt="">
                </label>

                <label class="cosa">
                    <input type="radio" name="esigenza" value="Essenziale">
                    <div>
                        <h4>Essenziale</h4>
                        <p>Ho bisogno di un percorso su misura</p>
                    </div>
                    <img src="{{ '/assets/img/contatti-4.png' | relative_url }}" alt="">
                </label>

                <label class="cosa">
                    <input type="radio" name="esigenza" value="Altro">
                    <div>
                        <h4>Altro</h4>
                        <p>La tua esigenza è diversa? Raccontacela.</p>
                    </div>
                    <img src="{{ '/assets/img/contatti-5.png' | relative_url }}" alt="">
                </label>
            </div>

            <form id="contatti-form">
                <h3>Raccontaci di te</h3>

                <div class="campi">
                    <input id="nome" name="nome" placeholder="Nome*" required>
                    <input id="cognome" name="cognome" placeholder="Cognome*" required>
                    <input id="e-mail" name="email" type="email" placeholder="E-mail*" required>
                    <input id="azienda" name="azienda" placeholder="Azienda*" required>
                </div>

                <textarea id="messaggio"
                          name="messaggio"
                          placeholder="In poche righe, da dove vorresti partire..."></textarea>

                <div class="consenso">
                    <input type="checkbox" id="privacy" name="privacy" required>
                    <label for="privacy">
                        Per presa visione dell'informativa specificata a questo link (*)
                    </label>
                </div>

                <div class="azioni">
                    <button type="submit">Invia richiesta</button>

                    <p id="urgente">
                        Hai una questione urgente? Scrivici su
                        <a href="{{ menu_5_url }}"
                           target="wa"
                           title="Scrivici su Whatsapp">Whatsapp</a>
                    </p>
                </div>
            </form>
        </div>
    </div>
</section>

<script>
document.getElementById('contatti-form').addEventListener('submit', function (event) {
    event.preventDefault();

    const esigenza = document.querySelector('input[name="esigenza"]:checked');

    const nome      = document.getElementById('nome').value.trim();
    const cognome   = document.getElementById('cognome').value.trim();
    const email     = document.getElementById('e-mail').value.trim();
    const azienda   = document.getElementById('azienda').value.trim();
    const messaggio = document.getElementById('messaggio').value.trim();

    const destinatario = 'info@esempio.it';

    const oggetto = 'Richiesta di contatto dal sito';

    const corpo =
        'Richiesta di contatto dal sito\n\n' +
        'ESIGENZA\n' +
        (esigenza ? esigenza.value : '') + '\n\n' +
        'NOME\n' +
        nome + '\n\n' +
        'COGNOME\n' +
        cognome + '\n\n' +
        'E-MAIL\n' +
        email + '\n\n' +
        'AZIENDA\n' +
        azienda + '\n\n' +
        'MESSAGGIO\n' +
        messaggio;

    const mailto =
        'mailto:' + destinatario +
        '?subject=' + encodeURIComponent(oggetto) +
        '&body=' + encodeURIComponent(corpo);

    window.location.href = mailto;
});
</script>
