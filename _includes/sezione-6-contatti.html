<section id="contatti">
    <div class="corpo">
        <header>
            <h2>Parla con un nostro consulente</h2>
            <p class="intro">
                Ti aiuteremo a capire quali competenze attivare e quale percorso può essere più adatto alla tua impresa.
            </p>
        </header>

        <div class="form">
            <p>Di cosa hai bisogno?</p>

            <div class="wrapper">
                <label class="cosa">
                    <input type="radio" name="richiesta" value="Primo Passo" class="cosa-radio">
                    <div>
                        <h4>Primo Passo</h4>
                        <p>Sto avviando un'impresa</p>
                    </div>
                    <img src="{{ '/assets/img/contatti-1.png' | relative_url }}" alt="">
                </label>

                <label class="cosa">
                    <input type="radio" name="richiesta" value="Spalla" class="cosa-radio">
                    <div>
                        <h4>Spalla</h4>
                        <p>Cerco un supporto continuativo</p>
                    </div>
                    <img src="{{ '/assets/img/contatti-2.png' | relative_url }}" alt="">
                </label>

                <label class="cosa">
                    <input type="radio" name="richiesta" value="Come stai?" class="cosa-radio">
                    <div>
                        <h4>Come stai?</h4>
                        <p>Voglio capire come sta la mia azienda</p>
                    </div>
                    <img src="{{ '/assets/img/contatti-3.png' | relative_url }}" alt="">
                </label>

                <label class="cosa">
                    <input type="radio" name="richiesta" value="Essenziale" class="cosa-radio">
                    <div>
                        <h4>Essenziale</h4>
                        <p>Ho bisogno di un percorso su misura</p>
                    </div>
                    <img src="{{ '/assets/img/contatti-4.png' | relative_url }}" alt="">
                </label>

                <label class="cosa">
                    <input type="radio" name="richiesta" value="Ho una esigenza diversa" class="cosa-radio">
                    <div>
                        <h4>Altro</h4>
                        <p>La tua esigenza è diversa? Raccontacela.</p>
                    </div>
                    <img src="{{ '/assets/img/contatti-5.png' | relative_url }}" alt="">
                </label>
            </div>

            <form id="contatti-form">
                <h3>Raccontaci di te</h3>

                <div class="campi">
                    <input id="nome"
                           name="nome"
                           placeholder="Nome*"
                           required>

                    <input id="cognome"
                           name="cognome"
                           placeholder="Cognome*"
                           required>

                    <input id="e-mail"
                           name="email"
                           type="email"
                           placeholder="E-mail*"
                           required>

                    <input id="azienda"
                           name="azienda"
                           placeholder="Azienda*"
                           required>
                </div>

                <textarea id="messaggio"
                          name="messaggio"
                          placeholder="In poche righe, da dove vorresti partire..."></textarea>

                <!-- Campo honeypot anti-spam: invisibile per le persone, i bot lo compilano -->
                <div class="hp-field" aria-hidden="true">
                    <label for="sito-web">Lascia vuoto questo campo</label>
                    <input type="text" id="sito-web" name="sito-web" tabindex="-1" autocomplete="off">
                </div>

                <div class="consenso">
                    <input type="checkbox"
                           id="privacy"
                           name="privacy"
                           required>

                    <label for="privacy">
                        Per presa visione dell'informativa specificata a questo link (*)
                    </label>
                </div>

                <div class="azioni">
                    <button type="submit">Invia richiesta</button>

                    <p id="urgente">
                        Hai una questione urgente? Scrivici su
                        <a href="{{ menu_5_url }}"
                           target="wa"
                           title="Scrivici su Whatsapp">Whatsapp</a>
                    </p>
                </div>
            </form>
        </div>
    </div>
</section>

<script>
document.addEventListener('DOMContentLoaded', function () {
    var form = document.getElementById('contatti-form');
    if (!form) return;

    // Evidenzia la card selezionata tra le opzioni "Di cosa hai bisogno?"
    var cardRadios = document.querySelectorAll('.cosa-radio');
    cardRadios.forEach(function (radio) {
        radio.addEventListener('change', function () {
            cardRadios.forEach(function (r) {
                r.closest('.cosa').classList.remove('selected');
            });
            if (radio.checked) {
                radio.closest('.cosa').classList.add('selected');
            }
        });
    });

    // Contenitore per i messaggi di esito (successo/errore)
    var feedback = document.createElement('p');
    feedback.id = 'contatti-feedback';
    feedback.setAttribute('role', 'status');
    feedback.style.display = 'none';
    form.appendChild(feedback);

    var submitBtn = form.querySelector('button[type="submit"]');

    form.addEventListener('submit', function (event) {
        event.preventDefault();

        // Evita doppi invii
        submitBtn.disabled = true;
        var originalLabel = submitBtn.textContent;
        submitBtn.textContent = 'Invio in corso...';

        feedback.style.display = 'none';
        feedback.classList.remove('ok', 'errore');

        var formData = new FormData(form);

        fetch('contatti.php', {
            method: 'POST',
            body: formData,
            headers: { 'X-Requested-With': 'XMLHttpRequest' }
        })
            .then(function (response) {
                return response.json().then(function (data) {
                    return { ok: response.ok, data: data };
                });
            })
            .then(function (result) {
                if (result.ok && result.data.success) {
                    feedback.textContent = 'Richiesta inviata correttamente. Ti risponderemo al più presto.';
                    feedback.classList.add('ok');
                    form.reset();
                } else {
                    feedback.textContent = result.data.message || 'Si è verificato un errore. Riprova o scrivici su Whatsapp.';
                    feedback.classList.add('errore');
                }
                feedback.style.display = 'block';
            })
            .catch(function () {
                feedback.textContent = 'Si è verificato un errore di connessione. Riprova o scrivici su Whatsapp.';
                feedback.classList.add('errore');
                feedback.style.display = 'block';
            })
            .finally(function () {
                submitBtn.disabled = false;
                submitBtn.textContent = originalLabel;
            });
    });
});
</script>
